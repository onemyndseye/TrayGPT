name: Build and Release (Linux + Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_args: --linux AppImage
            artifacts: dist/*.AppImage
          - os: windows-latest
            build_args: --win nsis
            artifacts: dist/*.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install wine (only for Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y wine64 wine32

      - name: Build Electron app
        run: |
          npm exec electron-builder -- ${{ matrix.build_args }}

      - name: Upload build artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
