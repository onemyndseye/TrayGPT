<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>TrayGPT</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #1e1e1e;
      color: white;
      font-family: sans-serif;

      /* Default visual cue */
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      transition: all 0.2s ease-in-out;
    }

    html:hover, body:hover {
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 20px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>ChatGPT</h1>
</body>
</html>
